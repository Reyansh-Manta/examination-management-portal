{% extends "base.html" %}

{% block title %}My Student Profile – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 700px;">

    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white p-3">
            <h4 class="mb-0"><i class="bi bi-person-circle me-2"></i>Official Student Profile</h4>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-light border small text-muted mb-4">
                <i class="bi bi-info-circle me-1"></i> Pre-registered college records (Roll Number, Department & Year) are maintained by the administrative directory.
            </div>

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ student.name }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ student.email }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Roll Number</label>
                        <input type="text"
                               name="roll_number"
                               class="form-control font-monospace"
                               placeholder="e.g., 2024CS01"
                               value="{{ profile.roll_number or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Department</label>
                        <input type="text"
                               name="department"
                               class="form-control"
                               placeholder="e.g., Computer Science and Engineering"
                               value="{{ profile.department or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Year of Study</label>
                        <input type="text"
                               name="year"
                               class="form-control"
                               placeholder="e.g., 3rd Year"
                               value="{{ profile.year or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Contact Phone</label>
                        <input type="text"
                               name="phone"
                               class="form-control"
                               placeholder="+91 XXXXXXXXXX"
                               value="{{ profile.phone or '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Role</label>
                        <input type="text"
                               class="form-control bg-light"
                               value="{{ student.role }}"
                               readonly>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4 pt-2 border-top">
                    <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Update Profile Details
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
