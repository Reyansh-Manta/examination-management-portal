<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Examination Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f9f6;
            min-height: 100vh;
            color: #18181b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .auth-card {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #d0e8da;
            box-shadow: 0 2px 8px rgba(45, 106, 79, 0.08);
            padding: 2rem 1.75rem;
        }

        .form-label {
            color: #27272a;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
        }

        .form-control {
            border: 1px solid #d0e8da;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.92rem;
            color: #18181b;
        }

        .form-control:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 2px rgba(45, 106, 79, 0.15);
            outline: none;
        }

        .input-group-text {
            background-color: #f4f9f6;
            border: 1px solid #d0e8da;
            border-right: none;
            border-radius: 6px 0 0 6px;
            color: #40916c;
            font-size: 0.9rem;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 6px 6px 0;
        }

        .input-group-text.toggle-pwd {
            border-left: none;
            border-right: 1px solid #d0e8da;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            color: #71717a;
        }

        .input-group .form-control.with-toggle {
            border-right: none;
            border-radius: 0;
        }

        .btn-submit {
            background-color: #2d6a4f;
            color: #ffffff;
            border: 1px solid #2d6a4f;
            border-radius: 6px;
            padding: 0.6rem;
            font-weight: 500;
            font-size: 0.92rem;
            transition: background-color 0.15s ease;
        }

        .btn-submit:hover {
            background-color: #1b4332;
            border-color: #1b4332;
            color: #ffffff;
        }

        .auth-link {
            color: #2d6a4f;
            font-weight: 500;
            text-decoration: underline;
        }

        .auth-link:hover {
            color: #1b4332;
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <div class="mb-4">
            <div class="d-flex align-items-center gap-2 mb-2">
                <i class="bi bi-mortarboard fs-4" style="color: #2d6a4f;"></i>
                <span class="fw-bold fs-5" style="color: #2d6a4f;">Exam Portal</span>
            </div>
            <h5 class="fw-semibold mb-1 text-dark">Sign In</h5>
            <p class="text-muted small mb-0">Enter your credentials to access your account</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-secondary py-2 px-3 small d-flex align-items-center gap-2 mb-3" role="alert">
                        <i class="bi bi-info-circle text-secondary"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="loginPassword" name="password" class="form-control with-toggle" placeholder="••••••••" required>
                    <span class="input-group-text toggle-pwd" onclick="togglePasswordVisibility('loginPassword', this)">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Sign In
            </button>

        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-1 text-muted small">
                Student? <a href="{{ url_for('register') }}" class="auth-link">Register account</a>
            </p>
            <p class="mb-0 text-muted small">
                Examiner? <a href="{{ url_for('examiner_register') }}" class="auth-link">Register account</a>
            </p>
        </div>

    </div>

    <script>
        function togglePasswordVisibility(inputId, toggleBtn) {
            const input = document.getElementById(inputId);
            const icon = toggleBtn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>

</body>
</html>
