{% extends "base.html" %}

{% block title %}Edit Examination – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="warm-card-header">
            <h4 class="mb-0 fw-bold" style="color: var(--color-text);">
                <i class="bi bi-pencil-square me-2" style="color: var(--color-warning);"></i>Edit Examination
            </h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Examination Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ examination.name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Course</label>
                    <select name="course_id" class="form-select" required>
                        {% for course in courses %}
                        <option value="{{ course.id }}"
                            {% if course.id == examination.course_id %}selected{% endif %}>
                            {{ course.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a href="{{ url_for('examinations') }}" class="btn btn-warm-outline-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Examinations
                    </a>
                    <button type="submit" class="btn btn-warm-primary px-4">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
