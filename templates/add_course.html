{% extends "base.html" %}

{% block title %}Add Course – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add New Course</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Course Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g., Computer Networks" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Course syllabus or overview..."></textarea>
                </div>

                <div class="border rounded p-3 bg-light mb-3">
                    <h6 class="fw-bold text-primary mb-2"><i class="bi bi-folder-plus me-1"></i> Attach Course Study Material (Optional)</h6>
                    <div class="mb-2">
                        <label class="form-label small text-muted">Material / Document Title</label>
                        <input type="text" name="resource_title" class="form-control form-control-sm" placeholder="e.g., Syllabus & Reference Guide">
                    </div>
                    <div>
                        <label class="form-label small text-muted">Resource URL / Link</label>
                        <input type="url" name="resource_url" class="form-control form-control-sm" placeholder="https://drive.google.com/... or https://example.com/notes.pdf">
                    </div>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a href="{{ url_for('courses') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Courses
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Add Course
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
