{% extends "base.html" %}

{% block title %}Edit Rubric – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Evaluation Criterion</h4>
        </div>
        <div class="card-body p-4">
            <h6 class="text-muted mb-3">Examination: <strong>{{ rubric.examination.name }}</strong></h6>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Criterion</label>
                    <input type="text"
                           name="criterion"
                           class="form-control"
                           value="{{ rubric.criterion }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Marks</label>
                    <input type="number"
                           name="marks"
                           class="form-control"
                           value="{{ rubric.marks }}"
                           min="1"
                           required>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a href="{{ url_for('manage_rubrics', examination_id=rubric.examination_id) }}"
                       class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Rubrics
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
