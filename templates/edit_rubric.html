{% extends "base.html" %}

{% block title %}Edit Rubric – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="warm-card-header">
            <h4 class="mb-0 fw-bold" style="color: var(--color-text);">
                <i class="bi bi-pencil-square me-2" style="color: var(--color-warning);"></i>Edit Evaluation Criterion
            </h4>
        </div>
        <div class="card-body p-4">
            
            <div class="mb-4 p-3 rounded-3" style="background: #faf7f2; border: 1px solid #ebd9c8;">
                <span class="small fw-bold text-uppercase" style="color: var(--color-muted);">Examination:</span>
                <span class="fw-bold ms-1" style="color: var(--color-text);">{{ rubric.examination.name }}</span>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Criterion</label>
                    <input type="text"
                           name="criterion"
                           class="form-control"
                           value="{{ rubric.criterion }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Marks</label>
                    <input type="number"
                           name="marks"
                           class="form-control"
                           value="{{ rubric.marks }}"
                           min="1"
                           required>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a href="{{ url_for('manage_rubrics', examination_id=rubric.examination_id) }}" class="btn btn-warm-outline-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Rubrics
                    </a>
                    <button type="submit" class="btn btn-warm-primary px-4">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
