{% extends "base.html" %}

{% block title %}Examiner Profile – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 650px;">

    <div class="card shadow-sm mb-4">
        <div class="warm-card-header d-flex align-items-center gap-2 p-3">
            <div class="rounded-circle d-flex align-items-center justify-content-center"
                 style="width: 42px; height: 42px; background: rgba(124, 79, 42, 0.12); color: var(--color-primary); font-size: 1.25rem;">
                <i class="bi bi-person-badge"></i>
            </div>
            <div>
                <h4 class="mb-0 fw-bold" style="color: var(--color-text);">Examiner Profile</h4>
                <small class="text-muted">Manage your academic credentials and specialization</small>
            </div>
        </div>

        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small" style="color: var(--color-text);">Full Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           style="border-color: var(--color-border);"
                           value="{{ examiner.name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small" style="color: var(--color-text);">Email Address</label>
                    <input type="email"
                           class="form-control"
                           style="background: #fdfbf7; border-color: var(--color-border); color: var(--color-muted);"
                           value="{{ examiner.email }}"
                           readonly>
                    <small class="text-muted">Email is managed by portal administration.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small" style="color: var(--color-text);">Qualification</label>
                    <input type="text"
                           name="qualification"
                           class="form-control"
                           style="border-color: var(--color-border);"
                           placeholder="e.g., Ph.D. in Computer Science"
                           value="{{ profile.qualification or '' }}">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: var(--color-text);">Specialization / Research Areas</label>
                    <input type="text"
                           name="specialization"
                           class="form-control"
                           style="border-color: var(--color-border);"
                           placeholder="e.g., Distributed Systems, Machine Learning"
                           value="{{ profile.specialization or '' }}">
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3" style="border-top: 1px solid var(--color-border);">
                    <a href="{{ url_for('examiner_dashboard') }}" class="btn btn-warm-outline-muted">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                    <button type="submit" class="btn btn-warm-primary px-4">
                        <i class="bi bi-check2-circle me-1"></i> Update Profile
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
