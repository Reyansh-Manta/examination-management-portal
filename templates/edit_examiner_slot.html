{% extends "base.html" %}

{% block title %}Edit Slot – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">

    <div class="card shadow-sm">
        <div class="warm-card-header">
            <h4 class="mb-0 fw-bold" style="color: var(--color-text);">
                <i class="bi bi-pencil-square me-2" style="color: var(--color-warning);"></i>Edit Examination Slot
            </h4>
        </div>
        <div class="card-body p-4">

            <div class="mb-4 p-3 rounded-3" style="background: #faf7f2; border: 1px solid #ebd9c8;">
                <span class="small fw-bold text-uppercase" style="color: var(--color-muted);">Examination:</span>
                <strong class="ms-1" style="color: var(--color-text);">{{ slot.examination.name }}</strong>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date"
                           name="date"
                           class="form-control"
                           value="{{ slot.date }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Time</label>
                    <input type="time"
                           name="time"
                           class="form-control"
                           value="{{ slot.time }}"
                           required>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a href="{{ url_for('examiner_slots') }}" class="btn btn-warm-outline-muted">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-warm-primary px-4">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>

        </div>
    </div>

</div>
{% endblock %}
