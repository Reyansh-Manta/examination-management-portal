{% extends "base.html" %}

{% block title %}Edit Course – Exam Portal{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Course</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Course Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ course.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea name="description" class="form-control" rows="4">{{ course.description or "" }}</textarea>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a href="{{ url_for('courses') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Courses
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
