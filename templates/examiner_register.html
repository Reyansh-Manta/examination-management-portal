<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examiner Registration | Examination Portal</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f9 0%, #e6edf5 50%, #dbe4ee 100%);
            min-height: 100vh;
        }

        .auth-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .portal-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e0edff;
            color: #0d6efd;
            font-size: 1.35rem;
        }

        .form-control {
            border-radius: 0.5rem;
            padding: 0.65rem 0.85rem;
            border-color: #dee2e6;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .input-group-text {
            background-color: #f8fafc;
            border-color: #dee2e6;
            color: #6c757d;
            border-radius: 0.5rem;
        }

        .btn-submit {
            border-radius: 0.5rem;
            padding: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }
    </style>
</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="card auth-card p-4 p-sm-5">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="portal-icon mb-3">
                <i class="bi bi-person-workspace"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Examiner Registration</h4>
            <p class="text-muted small mb-0">Sign up to manage and evaluate examinations</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert alert-info border-0 shadow-sm py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-info-circle-fill flex-shrink-0"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endwith %}

        <!-- Form -->
        <form method="POST" action="{{ url_for('examiner_register') }}">

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary mb-1">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="name" class="form-control" placeholder="Dr. Jane Smith" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary mb-1">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="examiner@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary mb-1">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit w-100 d-flex align-items-center justify-content-center gap-2">
                <span>Register as Examiner</span>
                <i class="bi bi-arrow-right-short fs-5"></i>
            </button>

        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <small class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-semibold">Sign in</a></small>
        </div>

    </div>

</div>

</body>
</html>
